# Paths are resolved relative to this file. No API key belongs in TOML.
schema = 1

[paths]
database = ".local/actio.sqlite"
# owned_root 上限 80 字符;本机仓库路径较长,runs 必须用短的绝对路径
runs = "D:/A_t"
authority = ".local/authority"
credential_file = ".local/credentials/token_key.txt"
python_install = ".local/python"
venv = ".local/phase1-env"
uv_cache = ".local/uv-cache"
temp = ".local/tmp"

[llm]
provider = "tokenkey"
base_url = "https://api.tokenkey.dev/v1"
model = "gpt-5.6"
# The current versioned gateway contract supports 512 output tokens.
max_output_tokens = 512
spending_policy = "uncapped"
episodes = ["compatible"]

# Optional historical inputs. Empty means unconfigured; no machine-specific fallback.
[history]
candidate_database = ""
evaluation_database = ""
