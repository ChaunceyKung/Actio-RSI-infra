# Gate configuration for ToMBench dataset.
# Based on ablation analysis (2026-05-20): results/ablation_0520/
#
# Oracle Gate theoretical upper bound: 84.15% (+4.69pp vs baseline 79.46%)
# All modules (no gate): 82.06% (+2.60pp vs baseline)
# Expected Gate performance: ~83.5-84.0% (+4.0-4.5pp vs baseline)
#
# Strategy distribution:
#   - Memory only: 8 tasks (most common, +1.0 to +18.7pp)
#   - All modules: 5 tasks (true complementarity, +5.0 to +46.7pp)
#   - No modules: 4 tasks (high baseline, modules hurt)
#   - RAG only: 2 tasks (small sample, +5.0 to +30.0pp)
#   - Skill only: 1 task (+12.5pp)

mode: "on"
story_prefix_len: 500

demand_to_gate:
  # Phase 2: 20-category fine-grained classification
  # NO_MODULES (4 types)
  AMBIGUOUS_STORY:       {skill: false, rag: false, memory: false}
  DISCREPANT_INTENTIONS: {skill: false, rag: false, memory: false}
  EMOTION_REGULATION:    {skill: false, rag: false, memory: false}
  MORAL_EMOTIONS:        {skill: false, rag: false, memory: false}

  # MEMORY_ONLY (8 types)
  FALSE_BELIEF:          {skill: false, rag: false, memory: true}
  FAUX_PAS:              {skill: false, rag: false, memory: true}
  DISCREPANT_EMOTIONS:   {skill: false, rag: false, memory: true}
  HINTING:               {skill: false, rag: false, memory: true}
  KNOWLEDGE_ATTENTION:   {skill: false, rag: false, memory: true}
  PERSUASION:            {skill: false, rag: false, memory: true}
  STRANGE_STORY:         {skill: false, rag: false, memory: true}
  UNEXPECTED_OUTCOME:    {skill: false, rag: false, memory: true}

  # SKILL_ONLY (1 type)
  PERCEPTS_KNOWLEDGE:    {skill: true,  rag: false, memory: false}

  # RAG_ONLY (2 types)
  FAILED_ACTIONS:        {skill: false, rag: true,  memory: false}
  DISCREPANT_DESIRES:    {skill: false, rag: true,  memory: false}

  # ALL_MODULES (5 types)
  HIDDEN_EMOTIONS:       {skill: true,  rag: true,  memory: true}
  KNOWLEDGE_PRETEND:     {skill: true,  rag: true,  memory: true}
  MULTIPLE_DESIRES:      {skill: true,  rag: true,  memory: true}
  PREDICTION_ACTIONS:    {skill: true,  rag: true,  memory: true}
  SCALAR_IMPLICATURE:    {skill: true,  rag: true,  memory: true}

rules:
  # ══════════════════════════════════════════════════════════════════════════
  # Phase 1: 高精度pattern规则（准确率≥95%，基于数据分析）
  # 分析报告: docs/pattern_accuracy_analysis.md
  # ══════════════════════════════════════════════════════════════════════════

  - name: "faux_pas_pattern"
    match:
      question_pattern: "(?i)inappropriate|不恰当|失礼|awkward|embarrass|rude"
    gate: {skill: false, rag: false, memory: true}
    # 覆盖: 280/2860 (9.8%), 准确率: 99.3%, 净收益: +276, 影响: +9.65pp
    # 匹配: Faux-pas (273), Unexpected Outcome (5), Hidden Emotions (2误匹配)

  - name: "scalar_implicature_pattern"
    match:
      question_pattern: "(?i)how many|多少"
    gate: {skill: true, rag: true, memory: true}
    # 覆盖: 198/2860 (6.9%), 准确率: 100%, 净收益: +198, 影响: +6.92pp
    # 匹配: Scalar Implicature (198)

  - name: "false_belief_pattern"
    match:
      question_pattern: "(?i)(think|believe|认为).*(where|在哪|look for|find)"
    gate: {skill: false, rag: false, memory: true}
    # 覆盖: 100/2860 (3.5%), 准确率: 100%, 净收益: +100, 影响: +3.50pp
    # 匹配: False Belief Task (100)

  - name: "hidden_emotions_pattern"
    match:
      question_pattern: "(?i)(real|true|actual).*(feeling|emotion|情绪|感受)"
    gate: {skill: true, rag: true, memory: true}
    # 覆盖: 30/2860 (1.0%), 准确率: 96.7%, 净收益: +28, 影响: +0.98pp
    # 匹配: Hidden Emotions (29), Moral Emotions (1误匹配)

  # ══════════════════════════════════════════════════════════════════════════
  # 已移除的低精度规则（准确率<95%）
  # ══════════════════════════════════════════════════════════════════════════
  #
  # ❌ strange_story_why_pattern: 准确率63.5%, 误匹配139/381 (36.5%)
  #    - 错误匹配: Ambiguous Story (99), Hidden Emotions (40)
  #    - 这些样本现在走Layer 2 LLM分类
  #
  # ❌ discrepant_emotions_pattern: 准确率50%, 无净收益
  #    - 错误匹配: Moral Emotions (11/22)
  #    - 这些样本现在走Layer 2 LLM分类
  # ══════════════════════════════════════════════════════════════════════════

  # ══════════════════════════════════════════════════════════════════════════
  # Phase 0: Task type rules (训练时可用，有task_type标签时精确匹配)
  # ══════════════════════════════════════════════════════════════════════════

  # ── No modules: high baseline, modules hurt (4 tasks) ──

  - name: "ambiguous_story"
    match: {task_type_exact: "Ambiguous Story Task"}
    gate: {skill: false, rag: false, memory: false}
    # Baseline 85.0% is optimal, all modules hurt

  - name: "discrepant_intentions"
    match: {task_type_exact: "Discrepant Intentions"}
    gate: {skill: false, rag: false, memory: false}
    # Baseline 90.0% is optimal

  - name: "emotion_regulation"
    match: {task_type_exact: "Emotion Regulation"}
    gate: {skill: false, rag: false, memory: false}
    # Baseline 55.0% is optimal (small sample n=20)

  - name: "moral_emotions"
    match: {task_type_exact: "Moral Emotions"}
    gate: {skill: false, rag: false, memory: false}
    # Baseline 85.0% is optimal

  # ── Memory only: most common strategy (8 tasks) ──

  - name: "discrepant_emotions"
    match: {task_type_exact: "Discrepant Emotions"}
    gate: {skill: false, rag: false, memory: true}
    # Memory 92.5% (+10.0pp)

  - name: "false_belief"
    match: {task_type_exact: "False Belief Task"}
    gate: {skill: false, rag: false, memory: true}
    # Memory 96.3% (+1.0pp), largest task (n=600)

  - name: "faux_pas"
    match: {task_type_exact: "Faux-pas Recognition Test"}
    gate: {skill: false, rag: false, memory: true}
    # Memory 81.2% (+6.8pp), large task (n=560)

  - name: "hinting"
    match: {task_type_exact: "Hinting Task Test"}
    gate: {skill: false, rag: false, memory: true}
    # Memory 99.0% (+1.0pp)

  - name: "knowledge_attention"
    match: {task_type_exact: "Knowledge-Attention Links"}
    gate: {skill: false, rag: false, memory: true}
    # Memory 40.0% (+10.0pp), small sample (n=20)

  - name: "persuasion"
    match: {task_type_exact: "Persuasion Story Task"}
    gate: {skill: false, rag: false, memory: true}
    # Memory 68.0% (+18.7pp), large improvement

  - name: "strange_story"
    match: {task_type_exact: "Strange Story Task"}
    gate: {skill: false, rag: false, memory: true}
    # Memory 90.3% (+3.9pp), large task (n=407)

  - name: "unexpected_outcome"
    match: {task_type_exact: "Unexpected Outcome Test"}
    gate: {skill: false, rag: false, memory: true}
    # Memory 76.3% (+2.8pp), large task (n=300)

  # ── RAG only: small sample tasks (2 tasks) ──

  - name: "failed_actions"
    match: {task_type_exact: "Completion of Failed Actions"}
    gate: {skill: false, rag: true, memory: false}
    # RAG 50.0% (+5.0pp), small sample (n=20)

  - name: "discrepant_desires"
    match: {task_type_exact: "Discrepant Desires"}
    gate: {skill: false, rag: true, memory: false}
    # RAG 80.0% (+30.0pp), small sample (n=20), large improvement

  # ── Skill only: information tracking (1 task) ──

  - name: "percepts_knowledge"
    match: {task_type_exact: "Percepts-Knowledge Links"}
    gate: {skill: true, rag: false, memory: false}
    # Skill 97.5% (+12.5pp)

  # ── All modules: true complementarity (5 tasks) ──

  - name: "hidden_emotions"
    match: {task_type_exact: "Hidden Emotions"}
    gate: {skill: true, rag: true, memory: true}
    # All 91.2% (+8.8pp)

  - name: "knowledge_pretend"
    match: {task_type_exact: "Knowledge-Pretend Play Links"}
    gate: {skill: true, rag: true, memory: true}
    # All 83.3% (+46.7pp), small sample (n=30), huge improvement

  - name: "multiple_desires"
    match: {task_type_exact: "Multiple Desires"}
    gate: {skill: true, rag: true, memory: true}
    # All 95.0% (+5.0pp), small sample (n=20)

  - name: "prediction_actions"
    match: {task_type_exact: "Prediction of Actions"}
    gate: {skill: true, rag: true, memory: true}
    # All 80.0% (+5.0pp), small sample (n=20)

  - name: "scalar_implicature"
    match: {task_type_exact: "Scalar Implicature Test"}
    gate: {skill: true, rag: true, memory: true}
    # All 56.0% (+6.0pp), large task (n=200)
