# Gate configuration for Hi-ToM dataset.
# Based on ablation analysis (2026-06-02): results/hitom_ablation_0602/
#
# Key findings:
# - Baseline: 63.33%
# - Memory only: 68.83% (+5.50pp) - BEST single module
# - Skill only: 65.33% (+2.00pp)
# - RAG only: 64.00% (+0.67pp)
# - All modules: 65.33% (+2.00pp) - SEVERE negative interaction (-6.17pp from expected)
#
# Problem: Module interference increases with question order (higher-order ToM)
#   - order_2: Memory +13.3pp, Full only +4.2pp (loss: -9.1pp)
#   - order_3: Memory +5.0pp, Full +0.0pp (loss: -5.0pp)
#   - order_4: Memory +1.7pp, Full +0.0pp (loss: -1.7pp)
#
# Strategy:
#   - order_0 (1st-order): ALL modules (simple, structured guidance helps)
#   - order_1-2 (2nd-3rd): MEMORY + light SKILL (moderate complexity)
#   - order_3-4 (4th-5th): MEMORY only (high complexity, avoid interference)
#
# Expected improvement:
#   - Conservative: 66-68% (+2.7-4.7pp vs baseline)
#   - Optimistic: 69-70% (+5.7-6.7pp vs baseline)
#   - Target: Match or exceed Memory-only 68.83%

mode: "on"
story_prefix_len: 500

demand_to_gate:
  # First-order ToM (order_0): Simple belief tracking
  # Strategy: ALL modules - structured guidance + experience
  # Baseline: 91.7%, Memory: 96.7%, Full: 96.7%
  # Rationale: Already performing well, modules don't interfere
  order_0: {skill: true, rag: true, memory: true}

  # Second-order ToM (order_1): "A thinks that B thinks..."
  # Strategy: MEMORY + SKILL (no RAG to reduce noise)
  # Baseline: 69.2%, Memory: 71.7%, Full: 70.0%
  # Rationale: Light interference, use experience + strategic hints
  order_1: {skill: true, rag: false, memory: true}

  # Third-order ToM (order_2): "A thinks that B thinks that C thinks..."
  # Strategy: MEMORY only
  # Baseline: 56.7%, Memory: 70.0%, Full: 60.8%
  # Rationale: Severe interference (-9.1pp), rely purely on experience
  order_2: {skill: false, rag: false, memory: true}

  # Fourth-order ToM (order_3): "A thinks that B thinks that C thinks that D thinks..."
  # Strategy: MEMORY only
  # Baseline: 52.5%, Memory: 57.5%, Full: 52.5%
  # Rationale: Total interference (-5.0pp), avoid any extra guidance
  order_3: {skill: false, rag: false, memory: true}

  # Fifth-order ToM (order_4): Maximum nesting depth
  # Strategy: MEMORY only
  # Baseline: 46.7%, Memory: 48.3%, Full: 46.7%
  # Rationale: Minimal gain but interference ruins it, keep it simple
  order_4: {skill: false, rag: false, memory: true}

rules:
  # ── Layer 1: Content-based rules (question pattern matching) ──
  # Hi-ToM questions have a perfect correlation: "think/thinks" count = question_order
  # Rules are checked in order, first match wins. Check from highest to lowest count.

  # Order 4: 4 nested mental states (e.g., "Where does A think B thinks C thinks D thinks X is?")
  # Pattern: at least 4 occurrences of "think" or "thinks"
  - name: "order_4_fourth_order_tom"
    match:
      question_pattern: '(?:.*\bthinks?\b){4}'
    gate: {skill: false, rag: false, memory: true}

  # Order 3: 3 nested mental states
  # Pattern: at least 3 occurrences (won't match order_4 since already matched above)
  - name: "order_3_third_order_tom"
    match:
      question_pattern: '(?:.*\bthinks?\b){3}'
    gate: {skill: false, rag: false, memory: true}

  # Order 2: 2 nested mental states (e.g., "Where does Alice think Bob thinks X is?")
  # Pattern: at least 2 occurrences
  - name: "order_2_second_order_tom"
    match:
      question_pattern: '(?:.*\bthinks?\b){2}'
    gate: {skill: false, rag: false, memory: true}

  # Order 1: 1 mental state (e.g., "Where does Alice think X is?")
  # Pattern: at least 1 occurrence
  - name: "order_1_first_order_tom"
    match:
      question_pattern: '\bthinks?\b'
    gate: {skill: true, rag: false, memory: true}

  # Order 0: Factual retrieval (e.g., "Where is X?")
  # Pattern: no "think" or "thinks" in the question
  - name: "order_0_factual_retrieval"
    match:
      question_pattern: '^(?!.*\bthinks?\b).*$'
    gate: {skill: true, rag: true, memory: true}

# LLM-based fallback prompt for samples without task_type
llm_prompt: |
  Analyze the following Theory of Mind question and determine its complexity level (question order).

  Question orders:
  - order_0: First-order belief ("Where does X think the object is?")
  - order_1: Second-order belief ("What does X think Y believes?")
  - order_2: Third-order belief ("What does X think Y believes Z thinks?")
  - order_3: Fourth-order belief (4 levels of nesting)
  - order_4: Fifth-order belief (5 levels of nesting)

  Story: {story_prefix}
  Question: {question}

  Count the maximum nesting depth of mental state attributions.
  Respond with exactly one of: order_0, order_1, order_2, order_3, order_4

# Performance notes:
#
# Theoretical upper bound (oracle gate):
#   order_0: 96.7% (use ALL, already achieved)
#   order_1: 71.7% (use Memory, slight loss with Skill but acceptable)
#   order_2: 70.0% (use Memory only, avoid -9.1pp loss)
#   order_3: 57.5% (use Memory only, avoid -5.0pp loss)
#   order_4: 48.3% (use Memory only, avoid -1.7pp loss)
#   Weighted average: ~69.0% (+5.7pp vs baseline)
#
# Expected real-world performance:
#   - Gate classification accuracy: ~85-90%
#   - With misclassification penalty: ~67-68%
#   - Still significantly better than all-modules (65.33%)
#   - Close to memory-only (68.83%) but with order_0 optimization
