[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actio-rsi"
version = "0.2.0"
description = "Bounded offline persistent agent vertical slice"
requires-python = ">=3.12,<3.13"
dependencies = ["deepseek-harness-sdk==0.1.5rc1", "mcp==1.26.0"]

[project.optional-dependencies]
eval = ["pydantic==2.13.5", "json-repair==0.48.0"]

[project.scripts]
actio = "actio.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
actio = ["README.md"]
"actio.resources" = ["pricing/*.json", "trust/*.json", "pins/*.json"]
"actio._vendor" = ["*.json", "SOTOPIA_LICENSE"]

"actio.adapters.transport" = ["DSH_LICENSE.txt", "plugins/*.mjs", "fixtures/*.mjs"]

"actio.adapters.persistence" = ["*.sql"]
